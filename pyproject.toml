[project]
name = "perplexity-content-design-audit"
version = "0.1.0"
description = "Unofficial: no affiliation with Perplexity. An outside-in audit of published product language, built from public sources."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
audit = "audit.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "mypy>=1.10", "ruff>=0.5", "types-PyYAML>=6.0"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audit"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

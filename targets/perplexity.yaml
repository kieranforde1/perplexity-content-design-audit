# Target: Perplexity's public product language. Unofficial, outside-in.
# Sources listed here are first-party and public. Third-party pages are research only (see AGENTS.md). No app automation.
name: perplexity
display_name: Perplexity

# Seconds between requests to the same site. Never lower than 1.
delay_seconds: 1.5

# Sources in priority order. English pages only.
sources:
  - name: api-docs
    surface: docs
    index: https://docs.perplexity.ai/llms.txt
  - name: api-changelog
    surface: changelog
    urls:
      - https://docs.perplexity.ai/docs/resources/changelog.md
  # The company's own "What we shipped" notes for the apps. English entries from its sitemap.
  - name: product-changelog

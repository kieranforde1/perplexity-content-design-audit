# Target: Perplexity's public product language. Unofficial, outside-in.
# First-party public sources only. No third-party coverage, no app automation.
name: perplexity
display_name: Perplexity

# Seconds between requests to the same site. Never lower than 1.
delay_seconds: 1.5

# Sources in priority order. English pages only.
sources:
  - name: api-docs
    surface: docs
    index: https://docs.perplexity.ai/llms.txt
  - name: api-changelog
    surface: changelog
    urls:
      - https://docs.perplexity.ai/docs/resources/changelog.md
  # The help centre publishes a Markdown copy of every article, listed per language.
  - name: help-centre
    surface: help
    index: https://www.perplexity.ai/help-center/_llms/en/help-center.txt
  # Comet's help pages are only listed in the all-languages index, so keep the English
  # ones. The merch store's help pages in the same index aren't product language.
  - name: comet-help
    surface: help
    index: https://www.perplexity.ai/help-center/llms.txt
    include: /help-center/comet/en/
  # The /pro and /max pages are built in the browser, so a plain fetch gets no text.
  - name: plans-and-pricing
    surface: pricing
    urls:
      - https://www.perplexity.ai/hub/pricing
      - https://www.perplexity.ai/enterprise
  - name: brand-hub
    surface: brand
    urls:
      - https://www.perplexity.ai/hub/brand
  - name: blog
    surface: blog
    urls:
      - https://www.perplexity.ai/hub/blog/spaces-are-now-projects

# Which stage a page belongs to, matched against its URL. First match wins.
# Anything unmatched is "other". Review these by hand.
stages:
  - match: /quickstart
    stage: first-use
  - match: /pricing
    stage: upgrade
  - match: /rate-limits-usage-tiers
    stage: upgrade
  - match: /error
    stage: error
  - match: /api-key-management
    stage: settings
  - match: /getting-started/projects
    stage: settings

# Lines repeated on every page that aren't product language.
boilerplate:
  - Documentation Index
  - Fetch the complete documentation index
  - Use this file to discover all available pages
  # A note to AI tools at the top of every help article.
  - Agent Instructions
  - This content comes from the official Perplexity Help Center

# Pages that are collected but left out of analysis (terms, checks). Cookbook pages are
# tutorials and example apps, not product language.
analysis_exclude:
  - /docs/cookbook/

terms:
  # Names to look for even if they're never capitalised mid-sentence. A seed is only
  # proposed if first-party snippets actually use it.
  seeds:
    - Agent API
    - Search API
    - Sonar
    - Comet
    - Computer
    - Projects
    - Spaces
    - Skills
    - Connectors
    - Teammates
    - Deep Research
    - Credits
  # Older names next to the name that replaced them, each with a first-party source.
  legacy_names:
    - old: Sonar
      current: Agent API
      source: https://docs.perplexity.ai/docs/agent-api/migrate-from-sonar/overview.md
    - old: Spaces
      current: Projects
      source: https://www.perplexity.ai/hub/blog/spaces-are-now-projects
  # Capitalised words that aren't this company's terms: generic technical words,
  # languages, standards and formats. Logged as rejected, never dropped silently.
  # Month names, units and file formats are rejected by a rule in terms.py, so they
  # don't need listing here.
  not_terms:
    - API
    - APIs
    - SDK
    - SDKs
    - HTTP
    - HTTPS
    - URL
    - URLs
    - URI
    - ID
    - IDs
    - UTC
    - ISO
    - CSS
    - SQL
    - LLM
    - LLMs
    - AI
    - MCP
    - CLI
    - OK
    - OAuth
    - Python
    - TypeScript
    - JavaScript
    - JS
    - Node
    - Bash
    - PowerShell
    - Unix
    - Mac
    - macOS
    - Windows
    - Linux
    - Markdown
    - DD
    - MM
    - YYYY
    - RFC
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - Authorization
    - Retry-After
    - Idempotency-Key
    - Content-Type
    - HTTPS URL
    - JSON Schema
    - Model Context Protocol
    - Streamable HTTP
    - UTF-8
    - FAQ
    - RAG
    - Word
    - API call
    - API response
    - JSON response
    - Python SDK
    - TypeScript SDK
    - SSE
    - YYYY-MM-DD
    # Ordinary words and team names that happen to be capitalised.
    - Customize
    - Page URL
    - Bug Reports
    - Feature Requests
    - Community Forum
    - Sales
    # Security and sign-in standards.
    - SOC
    - Type II
    - SSO
    - GDPR
    - SCIM
    # Page titles. Not terms themselves, but the terms inside them still count.
    - Connecting Perplexity
    - Getting Started
    - How credits work
    - Agent API Quickstart
  # Other companies' products, services and SDKs.
  third_party:
    - OpenAI
    - OpenAI SDK
    - OpenAI Responses
    - OpenAI Responses API
    - OpenAI Chat Completions
    - Anthropic
    - Anthropic SDK
    - Anthropic Messages
    - Claude
    - Claude Code
    - Google
    - Gemini
    - Gemini SDK
    - Google Gemini Flash
    - Cursor
    - VS Code
    - Codex
    - GitHub
    - AWS
    - Apple
    - NVIDIA
    - GLM
    - Stripe
    - Moonshot AI
    - Slack
    - AWS Marketplace
    - Android
    - App Store
    - Google Drive
    - Gmail
    - Linear
    - Microsoft
    - OneDrive
    - SharePoint
    - Snowflake
    - Asana
    - Confluence
    - Google Play
    - Notion
    - Outlook
    - Salesforce
    - Databricks
    - Microsoft Teams
  # Excerpts approved as boilerplate: each counts on one page only, not once per page.
  # `audit terms` lists candidates (text on more than 10 pages) in
  # cache/perplexity/repeated_text.csv. Add the ones you approve here.
  repeated_text: []
  # Most terms to propose for review. The rest stay in term_candidates.csv.
  max_proposed: 60
  # A term on fewer pages than this is "too few to tell", not "consistent".
  consistent_min_pages: 3

# Exceptions for `audit check`, where a match isn't a mistake.
check:
  # A changelog records the past, so an old name there was right when it was written.
  history_surfaces:
    - changelog
  # Pages about moving off an old name have to say it. The page that announces a rename
  # (the glossary row's source_url) is skipped without being listed here.
  rename_pages:
    - /migrate-from-sonar/
  # Glossary term -> phrases that contain the term but name something else.
  other_things:
    # NVIDIA graphics cards.
    Perplexity Pro:
      - RTX PRO
    # The verb, as in "monitor API usage".
    Monitor API:
      - monitor API usage
      - monitor API activity
    # Search APIs in general, not this company's.
    Search API:
      - web search APIs
    # Other portals: sign-in and billing pages for Enterprise accounts, other companies'
    # portals, and a trust site. None of them is the API Portal.
    portal:
      - admin portal
      - subscription portal
      - Support Portal
      - Stripe portal
      - HubSpot portal
      - customer portals
      - security portal
      - self-serve portal
      - billing portal
    # The ordinary verb, as in "Focus on data protection", and a word in someone else's
    # sentence.
    Focus:
      - Focus on
      - Perplexity focus
    # Colour presets in the brand guidelines, and Computer's own "Return to Presets".
    preset:
      - Off-palette presets
      - Return to Presets
    # "Workflow" as a general noun, and a GitHub feature.
    Workflows:
      - Example Workflows
      - GitHub Action Workflow
      - Workflow Automation
    # A card brand and the verb "master a skill".
    master:
      - Master Card
      - master material

# The committed snippets table only fills in excerpts for evidence rows. A test fails if
# it holds more than this many.
max_committed_excerpts: 1000
# How many of each finding's snippets keep their excerpt, to illustrate it rather than
# list every one.
evidence_per_finding: 5

# Strings from my own use of the web and iOS apps, typed in by hand.
typed_strings: data/perplexity/typed_strings.csv

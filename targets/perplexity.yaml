      - https://www.perplexity.ai/hub/guides/ai-adoption-guide-for-technical-leaders
      - https://www.perplexity.ai/hub/guides/ai-adoption-in-the-enterprise
      - https://www.perplexity.ai/hub/guides/ai-governance-in-the-world-of-agents
      - https://www.perplexity.ai/hub/guides/comet-for-sales
      - https://www.perplexity.ai/hub/guides/computer-for-counsel
      - https://www.perplexity.ai/hub/guides/computer-for-go-to-market-teams
      - https://www.perplexity.ai/hub/guides/computer-for-growing-businesses
